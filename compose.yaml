services:
  backup:
    image: ghcr.io/fklrtw/backup-to-proton-drive:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build: .
    container_name: backup-to-proton-drive
    # Profile prevents `docker compose up -d` from running a backup; invoke via `docker compose run --rm backup`
    profiles:
      - backup
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Multi-mapping list: L1 -> R1, L2 -> R2, ...
      SYNC_MAPPINGS: "/backups/documents:/Backups/Documents,/backups/photos:/Backups/Photos"
      EXCLUDE_PATTERNS: "*.tmp,*.swp,.DS_Store,Thumbs.db"
      DELETE_EMPTY_DIRS: "false"
      TRASH_OBSOLETE: "true"
      DRY_RUN: "false"
      # VERBOSE: "false"
      # Unencrypted run telemetry file shared read-only with the `status` companion container:
      STATUS_FILE: /data/status.json
      # Mandatory at-rest AES-256-GCM encryption key file for /data/session.json and /data/state.json:
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      # Only set ALLOW_PLAINTEXT_STATE="true" if you intentionally disable at-rest encryption:
      # ALLOW_PLAINTEXT_STATE: "false"
      # Concurrency tuning (defaults shown):
      # UPLOAD_CONCURRENCY: "5"
      # LOCAL_HASH_CONCURRENCY: "8"
      # REMOTE_SCAN_CONCURRENCY: "6"
      # ENABLE_SMALL_FILE_UPLOAD: "false"
      # Optional: point to a mounted YAML/JSON configuration file instead of SYNC_MAPPINGS:
      # CONFIG_FILE: /config/config.yaml
      #
      # Optional headless login credentials (used automatically if /data/session.json
      # does not exist yet or expires; omit when using interactive `login` once):
      # PROTON_USERNAME: your-account@proton.me
      # PROTON_PASSWORD_FILE: /run/secrets/proton_password
      # PROTON_TOTP_SECRET_FILE: /run/secrets/proton_totp_secret
      # PROTON_MAILBOX_PASSWORD_FILE: /run/secrets/proton_mailbox_password
    volumes:
      # Persistent volume storing /data/session.json, /data/state.json, and /data/status.json
      - proton_backup_data:/data
      # Read-only source directories matching L1, L2, ... in SYNC_MAPPINGS
      - ./example-data/documents:/backups/documents:ro
      - ./example-data/photos:/backups/photos:ro
      # Optional YAML/JSON config file:
      # - ./config.yaml:/config/config.yaml:ro
    secrets:
      - data_encryption_key
      # Optional headless Proton credentials:
      # - proton_password
      # - proton_totp_secret
      # - proton_mailbox_password

  # Lightweight read-only HTTP companion exposing /status and /health for Home Assistant or LAN monitoring
  status:
    image: ghcr.io/fklrtw/backup-to-proton-drive:latest
    # Uncomment to build locally instead of pulling from GHCR:
    # build: .
    container_name: backup-to-proton-drive-status
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - status-server
    ports:
      # Expose unauthenticated LAN status endpoint on port 9108 (keep behind LAN/firewall, not public Internet)
      - "9108:9108"
    environment:
      STATUS_FILE: /data/status.json
      STATUS_MAX_AGE_HOURS: "26"
      # Optional: enable authenticated `POST /trigger` (requires writable ./trigger mount + secret + systemd `.path` unit):
      # STATUS_TRIGGER_FILE: /trigger/backup.trigger
      # STATUS_TRIGGER_TOKEN_FILE: /run/secrets/status_trigger_token
      # STATUS_TRIGGER_COOLDOWN_SECONDS: "900"
      # Only set ALLOW_UNAUTHENTICATED_TRIGGER="true" if you intentionally allow unauthenticated LAN triggers:
      # ALLOW_UNAUTHENTICATED_TRIGGER: "false"
    volumes:
      # Mount only /data read-only; this companion never holds encryption keys or backup source folders
      - proton_backup_data:/data:ro
      # Optional writable trigger spool directory (create with: mkdir -p trigger && chown 1000:1000 trigger && chmod 700 trigger):
      # - ./trigger:/trigger
    # Optional bearer token secret when STATUS_TRIGGER_FILE is enabled:
    # secrets:
    #   - status_trigger_token
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9108/status').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  proton_backup_data:

secrets:
  # Create with: mkdir -p secrets && openssl rand -base64 32 > ./secrets/data_encryption_key.txt && chmod 0400 ./secrets/data_encryption_key.txt
  # Note for Docker Compose: ensure the container UID 1000 (`node`) can read the secret file.
  data_encryption_key:
    file: ./secrets/data_encryption_key.txt
  # proton_password:
  #   file: ./secrets/proton_password.txt
  # proton_totp_secret:
  #   file: ./secrets/proton_totp_secret.txt
  # proton_mailbox_password:
  #   file: ./secrets/proton_mailbox_password.txt
  # Create with: openssl rand -base64 32 > ./secrets/status_trigger_token.txt && chmod 0400 ./secrets/status_trigger_token.txt
  # status_trigger_token:
  #   file: ./secrets/status_trigger_token.txt
