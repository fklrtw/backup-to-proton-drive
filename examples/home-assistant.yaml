# Home Assistant Package Reference for monitoring `backup-to-proton-drive status-server`.
#
# Setup:
# 1. Start the companion `status` service from compose.yaml (`docker compose up -d`).
# 2. Replace `192.168.1.50` below with the LAN IP or hostname of your backup host.
# 3. Include this file as a package in Home Assistant `configuration.yaml`:
#      homeassistant:
#        packages:
#          proton_backup: !include packages/proton_backup.yaml
#    (or merge the top-level `rest:`, `template:`, and `automation:` blocks directly).
# 4. Restart Home Assistant completely (adding a new `rest:` integration requires a full restart;
#    YAML reloads alone will not register new REST sensors).
#
# Naming note:
# - Home Assistant derives default entity IDs from `name:` (not `unique_id:`). If you rename the
#   sensors below (for example adding a `Paperless ` prefix), update `sensor.proton_backup_status`
#   and `binary_sensor.proton_backup_needs_attention` throughout this file to match.

rest:
  - resource: http://192.168.1.50:9108/status
    scan_interval: 300
    timeout: 15
    sensor:
      # Home Assistant supports `json_attributes:` on `rest:` `sensor:` entities (not `binary_sensor:`).
      # Exposes `status` (`ok` / `warning` / `error` / `never_run`) plus compact summary attributes.
      # Note: `ageHours` and `checkedAt` are intentionally omitted from json_attributes because
      # they change on every poll and would unnecessarily inflate the Home Assistant recorder database.
      - name: "Proton Backup Status"
        unique_id: proton_backup_status
        value_template: "{{ value_json.status }}"
        json_attributes:
          - problem
          - healthy
          - overdue
          - running
          - lastRunAt
          - lastSuccessAt
          - durationSeconds
          - errorMessage
          - summary

      # Timestamp sensor showing when the last backup with complete local uploads finished.
      - name: "Proton Backup Last Success"
        unique_id: proton_backup_last_success
        device_class: timestamp
        value_template: "{{ value_json.lastSuccessAt if value_json.lastSuccessAt else None }}"

template:
  - binary_sensor:
      # Exposes a single `device_class: problem` indicator (`on` = Problem, `off` = Clear).
      # Trips on errors, partial trash warnings, overdue backups (`problem: true`), OR if the
      # status endpoint becomes unreachable (`unavailable` / `unknown`).
      - name: "Proton Backup Needs Attention"
        unique_id: proton_backup_needs_attention
        device_class: problem
        state: >
          {{
            not is_state('sensor.proton_backup_status', 'ok')
            or state_attr('sensor.proton_backup_status', 'problem') == true
          }}

automation:
  - id: proton_backup_problem_notify
    alias: "Proton Backup: Notify when backup needs attention"
    mode: single
    triggers:
      # Wait 10 minutes before alerting so host reboots or brief container updates do not false-trigger.
      - trigger: state
        entity_id: binary_sensor.proton_backup_needs_attention
        to: "on"
        for:
          minutes: 10
    actions:
      - action: persistent_notification.create
        data:
          notification_id: proton_backup_problem
          title: "Proton Drive Backup Needs Attention"
          message: >
            {% set backup_state = states('sensor.proton_backup_status') %}
            {% set is_overdue = state_attr('sensor.proton_backup_status', 'overdue') %}
            {% set last_success = state_attr('sensor.proton_backup_status', 'lastSuccessAt') %}
            {% set error_detail = state_attr('sensor.proton_backup_status', 'errorMessage') %}
            {% if backup_state in ['unavailable', 'unknown'] %}
            Backup status endpoint is unreachable (`{{ backup_state }}`).
            {% else %}
            Status: `{{ backup_state }}` | Overdue: `{{ is_overdue }}`
            Last success: {{ last_success or 'never' }}
            {% if error_detail %}Error: {{ error_detail }}{% endif %}
            {% endif %}
      # Optional (requires Spook custom integration): create a native Home Assistant Repairs issue
      # under Settings -> System -> Repairs (persists across restarts until dismissed below):
      # - action: repairs.create
      #   data:
      #     domain: spook
      #     issue_id: proton_backup_problem
      #     title: "Proton Drive Backup Needs Attention"
      #     description: >
      #       Status: {{ states('sensor.proton_backup_status') }}
      #       (overdue={{ state_attr('sensor.proton_backup_status', 'overdue') }},
      #       lastSuccessAt={{ state_attr('sensor.proton_backup_status', 'lastSuccessAt') or 'never' }})
      #       {{ state_attr('sensor.proton_backup_status', 'errorMessage') or '' }}
      #     severity: error
      #     persistent: true
      #
      # Optional: also push a mobile notification via the Home Assistant Companion App:
      # - action: notify.mobile_app_your_phone
      #   data:
      #     title: "Proton Drive Backup Needs Attention"
      #     message: >
      #       Status: {{ states('sensor.proton_backup_status') }}
      #       {{ state_attr('sensor.proton_backup_status', 'errorMessage') or '' }}

  - id: proton_backup_problem_dismiss
    alias: "Proton Backup: Dismiss notification when healthy"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.proton_backup_needs_attention
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: proton_backup_problem
      # Optional (if using Spook `repairs.create` above): auto-remove the Repairs issue when healthy:
      # - action: repairs.remove
      #   data:
      #     domain: spook
      #     issue_id: proton_backup_problem

