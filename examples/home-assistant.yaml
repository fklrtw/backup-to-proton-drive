# Home Assistant Package Reference for monitoring and triggering `backup-to-proton-drive status-server`.
#
# Setup:
# 1. Start the companion `status` service from compose.yaml (`docker compose up -d`).
#    To enable the on-demand trigger button (`button.proton_backup_trigger`), also configure
#    `STATUS_TRIGGER_FILE` + `STATUS_TRIGGER_TOKEN_FILE` on `status` and install
#    `systemd/backup-to-proton-drive-trigger.path` on the backup host.
# 2. Verify the `status-server` URL below (http://192.168.1.50:9108) matches the LAN IP or hostname of this backup host.
# 3. Add the matching trigger bearer token to Home Assistant `secrets.yaml` (required for `POST /trigger`):
#      proton_backup_trigger_authorization: "Bearer <contents-of-status_trigger_token.txt>"
# 4. Include this file as a package in Home Assistant `configuration.yaml`:
#      homeassistant:
#        packages:
#          proton_backup: !include packages/proton_backup.yaml
#    (or merge the top-level `rest:`, `rest_command:`, `template:`, and `automation:` blocks directly).
# 5. Restart Home Assistant completely (adding new `rest:` or `rest_command:` integrations requires a
#    full restart; YAML reloads alone will not register them).
#
# Multiple setups / naming note:
# - Regenerate a prefixed package cleanly without ID collisions across multiple backup hosts:
#     backup-to-proton-drive home-assistant-config --prefix <name> --status-url <url>
# - Home Assistant derives default entity IDs from `name:` (not `unique_id:`). If you manually rename
#   entities below, update `sensor.proton_backup_status`,
#   `binary_sensor.proton_backup_needs_attention`, and `button.proton_backup_trigger` throughout this
#   file to match.

rest:
  - resource: http://192.168.1.50:9108/status
    scan_interval: 300
    timeout: 15
    sensor:
      # Home Assistant supports `json_attributes:` on `rest:` `sensor:` entities (not `binary_sensor:`).
      # Exposes `status` (`ok` / `warning` / `error` / `never_run`) plus compact summary attributes.
      # Note: `ageHours`, `checkedAt`, and `triggerCooldownRemainingSeconds` are intentionally omitted
      # from json_attributes because they change over time without state transitions and would
      # unnecessarily inflate the Home Assistant recorder database.
      - name: "Proton Backup Status"
        unique_id: proton_backup_status
        value_template: "{{ value_json.status }}"
        json_attributes:
          - problem
          - healthy
          - overdue
          - running
          - lastRunAt
          - lastSuccessAt
          - durationSeconds
          - errorMessage
          - summary
          - triggerEnabled
          - triggerAvailable
          - triggerPending
          - triggerAvailableAt

      # Timestamp sensor showing when the last backup with complete local uploads finished.
      - name: "Proton Backup Last Success"
        unique_id: proton_backup_last_success
        device_class: timestamp
        value_template: "{{ value_json.lastSuccessAt if value_json.lastSuccessAt else None }}"

rest_command:
  # Authenticated on-demand trigger command invoked by `button.proton_backup_trigger` or automations.
  # Omit `headers:` only if `ALLOW_UNAUTHENTICATED_TRIGGER=true` is configured on `status-server`.
  proton_backup_trigger:
    url: http://192.168.1.50:9108/trigger
    method: POST
    timeout: 15
    headers:
      authorization: !secret proton_backup_trigger_authorization

template:
  - binary_sensor:
      # Exposes a single `device_class: problem` indicator (`on` = Problem, `off` = Clear).
      # Trips on errors, partial trash warnings, overdue backups (`problem: true`), OR if the
      # status endpoint becomes unreachable (`unavailable` / `unknown`).
      - name: "Proton Backup Needs Attention"
        unique_id: proton_backup_needs_attention
        device_class: problem
        state: >
          {{
            not is_state('sensor.proton_backup_status', 'ok')
            or state_attr('sensor.proton_backup_status', 'problem') == true
          }}

  - button:
      # Exposes a dashboard/automation button to trigger an on-demand backup via `POST /trigger`.
      # Automatically becomes `unavailable` while `status-server` is unreachable, trigger is disabled,
      # a backup is running, a trigger request is pending, or the cooldown period has not elapsed.
      # Referencing `now()` allows Home Assistant to re-enable the button automatically once
      # `triggerAvailableAt` passes, even before the next scheduled `rest:` poll.
      - name: "Proton Backup Trigger"
        unique_id: proton_backup_trigger
        icon: mdi:cloud-upload
        availability: >
          {% set backup_state = states('sensor.proton_backup_status') %}
          {% if backup_state in ['unavailable', 'unknown'] %}
            false
          {% elif state_attr('sensor.proton_backup_status', 'triggerEnabled') != true %}
            false
          {% elif state_attr('sensor.proton_backup_status', 'running') == true or state_attr('sensor.proton_backup_status', 'triggerPending') == true %}
            false
          {% elif state_attr('sensor.proton_backup_status', 'triggerAvailable') == true %}
            true
          {% else %}
            {% set available_at = state_attr('sensor.proton_backup_status', 'triggerAvailableAt') %}
            {{ available_at is string and available_at | length > 0 and now() >= as_datetime(available_at) }}
          {% endif %}
        press:
          - action: rest_command.proton_backup_trigger
            response_variable: trigger_response
          - delay:
              seconds: 2
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.proton_backup_status

automation:
  - id: proton_backup_problem_notify
    alias: "Proton Backup: Notify when backup needs attention"
    mode: single
    triggers:
      # Wait 10 minutes before alerting so host reboots or brief container updates do not false-trigger.
      - trigger: state
        entity_id: binary_sensor.proton_backup_needs_attention
        to: "on"
        for:
          minutes: 10
    actions:
      - action: persistent_notification.create
        data:
          notification_id: proton_backup_problem
          title: "Proton Drive Backup Needs Attention"
          message: >
            {% set backup_state = states('sensor.proton_backup_status') %}
            {% set is_overdue = state_attr('sensor.proton_backup_status', 'overdue') %}
            {% set last_success = state_attr('sensor.proton_backup_status', 'lastSuccessAt') %}
            {% set error_detail = state_attr('sensor.proton_backup_status', 'errorMessage') %}
            {% if backup_state in ['unavailable', 'unknown'] %}
            Backup status endpoint is unreachable (`{{ backup_state }}`).
            {% else %}
            Status: `{{ backup_state }}` | Overdue: `{{ is_overdue }}`
            Last success: {{ last_success or 'never' }}
            {% if error_detail %}Error: {{ error_detail }}{% endif %}
            {% endif %}
      # Optional (requires Spook custom integration): create a native Home Assistant Repairs issue
      # under Settings -> System -> Repairs (persists across restarts until dismissed below):
      # - action: repairs.create
      #   data:
      #     domain: spook
      #     issue_id: proton_backup_problem
      #     title: "Proton Drive Backup Needs Attention"
      #     description: >
      #       Status: {{ states('sensor.proton_backup_status') }}
      #       (overdue={{ state_attr('sensor.proton_backup_status', 'overdue') }},
      #       lastSuccessAt={{ state_attr('sensor.proton_backup_status', 'lastSuccessAt') or 'never' }})
      #       {{ state_attr('sensor.proton_backup_status', 'errorMessage') or '' }}
      #     severity: error
      #     persistent: true
      #
      # Optional: also push a mobile notification via the Home Assistant Companion App:
      # - action: notify.mobile_app_your_phone
      #   data:
      #     title: "Proton Drive Backup Needs Attention"
      #     message: >
      #       Status: {{ states('sensor.proton_backup_status') }}
      #       {{ state_attr('sensor.proton_backup_status', 'errorMessage') or '' }}

  - id: proton_backup_problem_dismiss
    alias: "Proton Backup: Dismiss notification when healthy"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.proton_backup_needs_attention
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: proton_backup_problem
      # Optional (if using Spook `repairs.create` above): auto-remove the Repairs issue when healthy:
      # - action: repairs.remove
      #   data:
      #     domain: spook
      #     issue_id: proton_backup_problem

